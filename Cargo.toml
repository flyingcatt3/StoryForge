[package]
name = "storyforge"
version = "0.1.0"
edition = "2021"
authors = ["StoryForge Contributors"]
description = "A modern visual novel engine powered by VNScript and Rust"
license = "MIT"

[dependencies]
# Language parsing
logos = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Image processing
image = "0.25"

# Audio
rodio = "0.19"

# UI framework
egui = "0.29"
eframe = { version = "0.29", features = ["default_fonts", "persistence"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Other utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
directories = "5.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
